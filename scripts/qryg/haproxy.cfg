global
    nbthread 1

defaults
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend fe_sni
    bind 127.0.0.1:8080
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend be_example if { req.ssl_sni example.com }

backend be_example
    server example 8.8.8.8:443
