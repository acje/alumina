static_resources:
  clusters:
  - name: fixed_backend
    type: STATIC
    connect_timeout: 5s
    load_assignment:
      cluster_name: fixed_backend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 8.8.8.8
                port_value: 443
  listeners:
  - name: connect_terminate
    address:
      socket_address:
        address: 127.0.0.1
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          http_protocol_options: {}
          stat_prefix: connect_terminate
          route_config:
            name: connect_routes
            virtual_hosts:
            - name: connect
              domains:
              - "*"
              routes:
              - match:
                  connect_matcher: {}
                route:
                  cluster: fixed_backend
                  timeout: 0s
                  upgrade_configs:
                  - upgrade_type: CONNECT
                    connect_config: {}
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
